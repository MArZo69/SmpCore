# Les LureCoins sont crédités par Tebex avec :
# /coin give <joueur> <montant>
lurecoin:
  name: "LureCoins"

# /trade : échange d'objets, d'argent et de niveaux d'XP.
trade:
  # Délai avant qu'une demande d'échange soit automatiquement refusée.
  request-timeout-seconds: 180
  # Anti-spam : délai minimum entre deux demandes envoyées par le même joueur.
  request-cooldown-seconds: 5
  # Délai pour saisir un montant / un nombre de niveaux dans le chat.
  input-timeout-seconds: 60
  # Autorise l'échange d'argent (économie Vault / Essentials).
  money-enabled: true
  # Autorise l'échange de niveaux d'XP.
  xp-enabled: true

# Prix de la boutique /boutique.
boutique:
  grades:
    heros: 500
    legende: 1500
    supreme: 2250
    divin: 2700

  # Clés vendues dans /boutique.
  # La commande exécutée est :
  #   /crates give physical <crate> <quantité> <joueur>
  # Le % de promo est calculé automatiquement à partir du prix unitaire.
  # material = icône affichée ; glow: true = effet enchanté.
  keys:
    - id: lurebox
      display: "<#A78BFA>LureBox</#A78BFA>"
      crate: "LureBox"
      material: HEART_OF_THE_SEA
      glow: true
      packages:
        - quantity: 1
          price: 700
        - quantity: 3
          price: 1800
        - quantity: 5
          price: 3000

    - id: spawnerbox
      display: "<#F0ABFC>SpawnerBox</#F0ABFC>"
      crate: "SpawnerBox"
      material: TRIPWIRE_HOOK
      glow: true
      packages:
        - quantity: 1
          price: 900
        - quantity: 3
          price: 2500
        - quantity: 5
          price: 4000
